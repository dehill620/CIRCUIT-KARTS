function how(){ui(`<div class=col><h1>CONTROLS</h1><div style="font-size:18px;line-height:1.7;text-shadow:2px 2px #10243e">W / ↑ gas · S / ↓ brake<br>A D / ← → steer<br>Space (hold + steer) drift, release for mini-turbo<br>E use item · 🍄 boost · 🍌 hazard · 🐢 homing shell<br>Hit item boxes for items. 3 laps. Finish 1st to be MVP.</div><button class=b onclick=menu()>Back</button></div>`)}
let ICN=null;
function mkIcons(){const ir=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});ir.setSize(128,128);const s=new T.Scene(),cm=new T.PerspectiveCamera(28,1,.1,50);s.add(new T.HemisphereLight(0xffffff,0x8899aa,1.1));const d=new T.DirectionalLight(0xffffff,.9);d.position.set(3,5,8);s.add(d);
 ICN=CH.map(c=>{const m=mk(c,null);s.add(m);const hy=.75+1.3*c.z,hz=-.4+.1*c.z;cm.position.set(0,hy,hz+3.6);cm.lookAt(0,hy,hz);ir.render(s,cm);const u=ir.domElement.toDataURL();s.remove(m);return u});ir.dispose();if(ir.forceContextLoss)ir.forceContextLoss()}
function signTex(){const cv=document.createElement('canvas');cv.width=1024;cv.height=160;const x=cv.getContext('2d');x.fillStyle='#143a8a';x.fillRect(0,0,1024,160);x.strokeStyle='#ffd21f';x.lineWidth=12;x.strokeRect(6,6,1012,148);
 for(let i=0;i<44;i++)for(const y of[14,146]){x.fillStyle=i%2?'#fff6a0':'#ffb020';x.beginPath();x.arc(20+i*22.5,y,6,0,6.3);x.fill()}
 x.font='900 96px Arial Black,Impact,sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=14;x.strokeStyle='#5a1600';x.strokeText('CIRCUIT KARTS',512,82);const g=x.createLinearGradient(0,40,0,120);g.addColorStop(0,'#ffd23a');g.addColorStop(1,'#ff5a1f');x.fillStyle=g;x.fillText('CIRCUIT KARTS',512,82);return new T.CanvasTexture(cv)}
const SIGN=signTex();
function selScr(){S='sel';sel=cs;if(!ICN)mkIcons();drawSel()}
function drawSel(){const c=CH[sel],ok=unl(sel);showPv(sel,0);ui(`<div class=grid>${CH.slice(0,OWN?11:10).map((x,i)=>`<div class="pt ${i==sel?'on':''} ${i==10?'own':''} ${unl(i)?'':'lk'}" style="background:${hex(x.h)}" onclick="sel=${i};drawSel()">${ICN?`<img src="${ICN[i]}" ${unl(i)?'':'style=filter:brightness(0)'}>`:''}</div>`).join('')}</div><div class=panel><h2>${ok?c.n:'Locked'}</h2>${['Speed','Accel','Handling','Weight'].map((s,i)=>`<div class=st>${s}<i><u style="width:${ok?c.st[i]*10:0}%"></u></i></div>`).join('')}<div class=sw>${KC.map((q,i)=>`<span style="background:${q?hex(q):hex(c.k)}" class="${i==kcI?'on':''}" onclick="kcI=${i};drawSel()"></span>`).join('')}</div>${ok?'':'<p style="font-size:13px">Win a Grand Prix to unlock racers.</p>'}</div><div class=bar><button class=b onclick=menu()>Back</button><button class="b y ${ok?'':'off'}" onclick=conf()>Confirm</button></div>`)}
function conf(){if(unl(sel)){cs=sel;menu()}}
function podium(){S='pod';const o=order();$('#hud').style.display='none';pg.clear();pvM=null;pod=[];
 if(!o[0].isP){S='res';ui(`<div class=mvp><small>RESULTS</small><h1>You: ${o.indexOf(P)+1} / 8</h1><div class=res>${o.map((r,i)=>`<div class="${r.isP?'me':''}">${i+1}. ${r.c.n}</div>`).join('')}</div><div class=btns><button class="b y" onclick=again()>Race Again</button><button class=b onclick=menu()>Menu</button></div></div>`);return}
 [[0,1.6,0xffd21f],[-4.4,1.1,0xc0c0c0],[4.4,.7,0xcd7f32]].forEach((q,i)=>{const b=new T.Mesh(new T.BoxGeometry(3.6,q[1],3),new T.MeshStandardMaterial({color:q[2],metalness:.5,roughness:.3}));b.position.set(q[0],q[1]/2,0);b.receiveShadow=true;pg.add(b);const m=mk(o[i].c,o[i].isP&&KC[kcI]?KC[kcI]:null);m.position.set(q[0],q[1]+.1,0);m.scale.setScalar(.85);m.rotation.y=-q[0]*.07;pg.add(m);pod.push({m,y:q[1]+.1})});
 pcam.position.set(0,4.5,15);pcam.lookAt(0,2.6,0);const w=o[0];[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.35),i*180));if(w.isP&&wins<4){wins++;try{localStorage.ck_w=wins}catch(e){}}
 ui(`<div class=mvp><small>★ MVP ★</small><h1>1st PLACE</h1><div>${w.c.n} · ${MV[mvI]}</div>${w.isP&&wins<=4?'<div style="color:#ffd21f">New racer unlocked!</div>':''}<div class=res>${o.map((r,i)=>`<div class="${r.isP?'me':''}">${i+1}. ${r.c.n}</div>`).join('')}</div><div class=btns><button class="b y" onclick=again()>Race Again</button><button class=b onclick=menu()>Menu</button></div></div>`)}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const q=e.key.toLowerCase();k[q]=1;snd();if(q==' ')e.preventDefault();
 if(q=='escape'&&(S=='race'||S=='count'||S=='fin'))pause();
 if(S=='race'&&!pz&&q=='e'&&P.item&&!P.fin)useItem(P);
 if(S=='sel'){const d={arrowleft:-1,arrowright:1,arrowup:-5,arrowdown:5}[q];if(d){sel=cl(sel+d,0,OWN?10:9);drawSel()}if(q=='enter')conf();if(q=='escape')menu()}
 else if(S=='menu'&&q=='enter')play()});
addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);addEventListener('pointerdown',snd);
let last=performance.now(),tm=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
 const rc=S=='race'||S=='count'||S=='fin';if(rc&&!pz)race(dt);else sfxOff();
 if(pvM){pvM.scale.setScalar(pvM.scale.x+(1-pvM.scale.x)*Math.min(1,dt*8));if(S=='mv')mvAnim(pvM,tm,mvI,0);else{pvM.rotation.y+=dt*.9;pvM.position.y=Math.sin(tm*2)*.08}}cf.visible=S=='pod';FP.upd(dt);if(S=='pod'){fw-=dt;if(fw<=0){fw=.5;fwk()}}
 if(S=='pod'){const a=cf.geometry.attributes.position;for(let i=0;i<CN;i++){let y=a.array[i*3+1]-dt*3;if(y<0)y=14;a.array[i*3+1]=y}a.needsUpdate=true;
  pod.forEach((p,i)=>{if(i==0)mvAnim(p.m,tm,mvI,p.y);else{p.m.position.y=p.y+Math.abs(Math.sin(tm*3))*.25;p.m.rotation.x=.08}});pcam.position.set(Math.sin(tm*.4)*5,4.5,15-Math.abs(Math.sin(tm*.4))*2);pcam.lookAt(0,2.6,0)}
 rn.render(rc?sc:pv,rc?cam:pcam)}
let OKEY='';
async function unlockOwner(key,quiet){try{const r=await fetch('/owner',{headers:{'x-owner-key':key},cache:'no-store'});if(!r.ok)throw 0;const code=await r.text();OKEY=key;OWN=true;try{localStorage.ck_ok=key}catch(e){}(0,eval)(code);msg('\u{1F451} Owner mode on',1500);if(S=='menu')menu()}catch(e){if(!quiet)msg('Wrong key',1200)}}
addEventListener('keydown',e=>{if(e.key=='`'&&e.target.tagName!='INPUT'&&!OWN){const k=prompt('Owner key');if(k)unlockOwner(k)}});
try{const k=localStorage.ck_ok;if(k)unlockOwner(k,true)}catch(e){}
menu();requestAnimationFrame(loop);
